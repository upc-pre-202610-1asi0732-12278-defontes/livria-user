# Publica el APK en GitHub Releases al pushear un tag de versión (ej. v1.0.0).
# Requiere: permisos de workflow "Read and write" para GITHUB_TOKEN (Settings → Actions → General).
# Requiere: secret API_BASE (Settings → Secrets and variables → Actions) con la URL base del backend,
#   sin barra final (ej. https://api.example.com).

name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=API_BASE="${{ secrets.API_BASE }}" || true

          APK=""
          for candidate in \
            build/app/outputs/flutter-apk/app-release.apk \
            android/app/build/outputs/apk/release/app-release.apk \
            build/app/outputs/apk/release/app-release.apk; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done

          if [ -z "$APK" ]; then
            APK="$(find . -path '*/outputs/apk/release/app-release.apk' -not -path '*/intermediates/*' | head -1)"
          fi

          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi

          echo "Using APK: $APK"
          CANONICAL="build/app/outputs/flutter-apk/app-release.apk"
          if [ "$APK" != "$CANONICAL" ]; then
            mkdir -p build/app/outputs/flutter-apk
            cp "$APK" "$CANONICAL"
          fi

      - name: Name artifact with tag
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "livria-user-${{ github.ref_name }}.apk"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: livria-user-${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
